<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="task2_3.css">
</head>
<body>
  <main class="app">
    <h1>Todo List</h1>
    <div class="row">
      <input id="taskInput" type="text" placeholder="Enter a task..." aria-label="New task" maxlength="80">
      <button id="addBtn">Add</button>
    </div>
    <p id="error" class="error" role="alert" hidden></p>
    <ul id="taskList"></ul>
    <p id="count" class="count"></p>
  </main>
  <script src="task2_3.js"></script>
</body>
</html>
